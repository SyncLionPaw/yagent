<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yagent</title>
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cell: clamp(16px, 5.4vw, 25px);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Space Grotesk', 'Hiragino Sans', 'PingFang SC', 'Noto Sans JP', 'Microsoft YaHei', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 32px;
            z-index: 10;
        }

        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 1px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .wordmark canvas {
            display: block;
        }

        .topnav {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .topnav a {
            font-size: 13px;
            color: var(--faint);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .topnav a:hover {
            color: var(--ink);
        }

        /* ---------- 语言选择 ---------- */
        .lang {
            position: relative;
        }

        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--faint);
            border: 1px solid var(--hairline);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .lang-btn:hover,
        .lang.open .lang-btn {
            color: var(--ink);
            border-color: var(--control-hover-border);
        }

        .lang-caret {
            opacity: 0.7;
            transition: transform 0.2s ease;
        }

        .lang.open .lang-caret {
            transform: rotate(180deg);
        }

        .lang-btn:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        /* ---------- 首屏（网格只出现在这里，向下淡出） ---------- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 96px 24px 64px;
            position: relative;
            /* 底层网格；顶层遮罩把下沿淡进纯色，features 不再带格 */
            background-color: var(--bg);
            background-image:
                linear-gradient(to bottom, transparent 58%, var(--bg) 92%),
                linear-gradient(to right, var(--grid-faint) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-faint) 1px, transparent 1px);
            background-size:
                auto,
                var(--cell) var(--cell),
                var(--cell) var(--cell);
            background-repeat: no-repeat, repeat, repeat;
            transition: background-color 0.25s ease;
        }

        .main-grid {
            display: inline-grid;
            grid-template-columns: repeat(4, auto);
            grid-template-rows: repeat(4, auto);
            gap: 0;
            /* 透明：落在 hero 网格上，不另起一块 */
            background: transparent;
        }

        .big-cell {
            display: grid;
            grid-template-columns: repeat(4, var(--cell));
            grid-template-rows: repeat(4, var(--cell));
            gap: 0;
        }

        .small-cell {
            width: var(--cell);
            height: var(--cell);
            background: transparent;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 选中：内嵌圆形，与方块边界留出 1px */
        .small-cell::after {
            content: '';
            position: absolute;
            inset: 2px; /* 1px 边框 + 1px 留白 */
            border-radius: 50%;
            background: var(--dot-color, #ffffff);
            box-shadow: 0 0 6px var(--dot-color, #ffffff);
            opacity: var(--fo, 0);
            transform: scale(0.4);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .small-cell.selected::after {
            opacity: 1;
            transform: scale(1);
        }

        /* 右下角笔画：半透明淡出 */
        .small-cell.selected.ghost::after {
            opacity: 0.10;
        }

        .tagline {
            font-size: clamp(26px, 4vw, 40px);
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin: 56px 0 0;
            max-width: 22em;
        }

        .subline {
            font-size: 15px;
            line-height: 1.9;
            color: var(--muted);
            margin: 18px 0 0;
            max-width: 34em;
        }

        .cta-row {
            margin-top: 36px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .cta {
            display: inline-block;
            padding: 11px 28px;
            font-size: 14px;
            color: var(--bg);
            background: var(--ink);
            border-radius: 999px;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .cta:hover {
            background: var(--accent);
            color: var(--cta-hover-ink);
            transform: translateY(-1px);
        }

        .ghost-link {
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.2s ease;
        }

        .ghost-link:hover {
            color: var(--ink);
        }

        /* 加载时的一次性入场 */
        .tagline, .subline, .cta-row {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .hero.ready .tagline { opacity: 1; transform: none; transition-delay: 0.15s; }
        .hero.ready .subline { opacity: 1; transform: none; transition-delay: 0.35s; }
        .hero.ready .cta-row { opacity: 1; transform: none; transition-delay: 0.55s; }

        /* ---------- 产品一览（编辑式纵向陈列） ---------- */
        .showcase {
            max-width: 880px;
            margin: 0 auto;
            padding: 48px 24px 96px;
        }

        .showcase-head {
            margin-bottom: 48px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--hairline);
        }

        .showcase-title {
            margin: 0;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--faint);
        }

        .showcase-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .showcase-item {
            margin: 0;
            padding: 40px 0;
            border-bottom: 1px solid var(--hairline);
            display: grid;
            grid-template-columns: 3.5rem 1fr;
            gap: 8px 20px;
            align-items: start;
        }

        .showcase-item:first-child {
            padding-top: 0;
        }

        .showcase-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .showcase-idx {
            grid-row: 1 / span 2;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--faint);
            line-height: 1.4;
            padding-top: 3px;
        }

        .showcase-copy {
            min-width: 0;
        }

        .showcase-name {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .showcase-desc {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: var(--muted);
            max-width: 36em;
        }

        .showcase-item img {
            grid-column: 1 / -1;
            display: block;
            width: 100%;
            height: auto;
            margin-top: 22px;
            border-radius: 12px;
            border: 1px solid var(--hairline);
            background: color-mix(in srgb, var(--ink) 3%, var(--bg));
        }

        /* ---------- 特性 ---------- */
        .features {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .feature {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 24px;
            padding: 32px 0;
            border-top: 1px solid var(--hairline);
        }

        .feature h2 {
            font-size: 16px;
            font-weight: 500;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .feature p {
            font-size: 14px;
            line-height: 1.9;
            color: var(--muted);
            margin: 0;
            max-width: 34em;
        }

        /* ---------- 评价（双行相向跑马灯） ---------- */
        .voices {
            padding: 24px 0 120px;
            overflow: hidden;
        }

        .voices-head {
            text-align: center;
            margin-bottom: 36px;
            padding: 0 24px;
        }

        .voices-title {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--faint);
        }

        .marquee-stack {
            --marquee-gap: 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .marquee {
            position: relative;
            overflow: hidden;
            mask-image: linear-gradient(
                to right,
                transparent,
                #000 5%,
                #000 95%,
                transparent
            );
            -webkit-mask-image: linear-gradient(
                to right,
                transparent,
                #000 5%,
                #000 95%,
                transparent
            );
        }

        .marquee-track {
            display: flex;
            width: max-content;
        }

        .marquee-track.left {
            animation: marquee-left 52s linear infinite;
        }

        .marquee-track.right {
            animation: marquee-right 58s linear infinite;
        }

        .marquee-stack:hover .marquee-track {
            animation-play-state: paused;
        }

        .marquee-group {
            display: flex;
            gap: var(--marquee-gap);
            padding-right: var(--marquee-gap);
        }

        .voice {
            flex: 0 0 min(360px, 78vw);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
            min-height: 156px;
            padding: 22px 24px;
            border: 1px solid var(--hairline);
            border-radius: 14px;
            background: color-mix(in srgb, var(--ink) 3%, var(--bg));
        }

        .voice blockquote {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.7;
        }

        .voice .who {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--ink);
        }

        .voice .avatar {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--avatar-bg, #c4b5a0);
        }

        .voice .avatar img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .voice .meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .voice .name {
            font-weight: 500;
            line-height: 1.3;
        }

        .voice .role {
            color: var(--faint);
            font-size: 12px;
            line-height: 1.3;
        }

        @keyframes marquee-left {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        @keyframes marquee-right {
            from { transform: translateX(-50%); }
            to { transform: translateX(0); }
        }

        /* ---------- 页脚 ---------- */
        footer {
            padding: 32px;
            text-align: center;
            font-size: 12px;
            color: var(--faint);
            border-top: 1px solid var(--hairline);
        }

        @media (max-width: 600px) {
            .feature {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .topbar {
                padding: 18px 20px;
            }

            .hero {
                padding-left: 16px;
                padding-right: 16px;
            }

            .topnav {
                gap: 14px;
            }

            .lang-btn {
                padding: 6px 10px;
                gap: 6px;
            }

            .showcase {
                padding: 32px 16px 72px;
            }

            .showcase-item {
                grid-template-columns: 2.5rem 1fr;
                gap: 6px 14px;
                padding: 32px 0;
            }

            .showcase-name {
                font-size: 16px;
            }

            .showcase-item img {
                margin-top: 16px;
                border-radius: 10px;
            }

            .voices {
                padding: 8px 0 96px;
            }

            .marquee-stack {
                gap: 14px;
            }

            .voice {
                min-height: 140px;
                padding: 18px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .small-cell,
            .small-cell::after,
            .tagline, .subline, .cta-row {
                transition: none;
            }

            .tagline, .subline, .cta-row {
                opacity: 1;
                transform: none;
            }

            .marquee-track {
                animation: none !important;
                transform: none !important;
            }

            .marquee {
                overflow-x: auto;
                mask-image: none;
                -webkit-mask-image: none;
                padding: 0 16px;
            }

            .marquee-group[aria-hidden="true"] {
                display: none;
            }
        }
    </style>
</head>

    <script src="theme.js"></script>
    <script>
        const mainGrid = document.getElementById('mainGrid');
        const selected = new Set();
        const allCells = [];
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function cellSize() {
            return allCells.length ? allCells[0].offsetWidth : 25;
        }

        // ---------- 动效：常驻细微扰动 + 光标力场 ----------
        const FORCE_RADIUS = 90;  // 力场半径（px）
        const MAX_SHIFT = 9;      // 力场最大偏移（px）
        const DRIFT = 1.3;        // 常驻扰动幅度（px）
        let mouse = null;

        mainGrid.addEventListener('mousemove', e => {
            mouse = { x: e.clientX, y: e.clientY };
        });
        mainGrid.addEventListener('mouseleave', () => {
            mouse = null;
        });
        // 触摸设备：手指滑动同样触发力场
        mainGrid.addEventListener('touchmove', e => {
            const t = e.touches[0];
            mouse = { x: t.clientX, y: t.clientY };
        }, { passive: true });
        mainGrid.addEventListener('touchend', () => {
            mouse = null;
        });

        function tick(t) {
            const time = t / 1000;
            const rect = mainGrid.getBoundingClientRect();
            const cs = cellSize();
            allCells.forEach(cell => {
                // 每个粒子按自己的相位和频率轻微漂移
                let ox = Math.sin(time * cell._w1 + cell._p1) * DRIFT;
                let oy = Math.cos(time * cell._w2 + cell._p2) * DRIFT;
                let faint = 0;
                if (mouse) {
                    const cx = rect.left + (+cell.dataset.col) * cs + cs / 2;
                    const cy = rect.top + (+cell.dataset.row) * cs + cs / 2;
                    const dx = cx - mouse.x, dy = cy - mouse.y;
                    const d = Math.hypot(dx, dy);
                    if (d < FORCE_RADIUS && d > 0.01) {
                        const strength = Math.pow(1 - d / FORCE_RADIUS, 2);
                        ox += (dx / d) * strength * MAX_SHIFT;
                        oy += (dy / d) * strength * MAX_SHIFT;
                        faint = 0.25 * (1 - d / FORCE_RADIUS);
                    }
                }
                cell.style.transform = `translate(${ox.toFixed(2)}px, ${oy.toFixed(2)}px)`;
                if (!cell.classList.contains('selected')) {
                    if (faint > 0.01) cell.style.setProperty('--fo', faint.toFixed(3));
                    else cell.style.removeProperty('--fo');
                }
            });
            requestAnimationFrame(tick);
        }
        if (!reducedMotion) requestAnimationFrame(tick);

        // 让首屏网格线与 logo 小格对齐（相对 hero 定位）
        const hero = document.getElementById('hero');
        function alignBackgroundGrid() {
            const gridRect = mainGrid.getBoundingClientRect();
            const heroRect = hero.getBoundingClientRect();
            const x = Math.round(gridRect.left - heroRect.left);
            const y = Math.round(gridRect.top - heroRect.top);
            // 第 1 层是淡出遮罩（固定 0 0）；第 2/3 层是网格
            hero.style.backgroundPosition = `0 0, ${x}px ${y}px, ${x}px ${y}px`;
        }
        window.addEventListener('resize', alignBackgroundGrid);

        // 创建 4×4 的大格子，每个大格子内含 4×4 的小格子
        for (let bigRow = 0; bigRow < 4; bigRow++) {
            for (let bigCol = 0; bigCol < 4; bigCol++) {
                const bigCell = document.createElement('div');
                bigCell.className = 'big-cell';

                for (let smallRow = 0; smallRow < 4; smallRow++) {
                    for (let smallCol = 0; smallCol < 4; smallCol++) {
                        const cell = document.createElement('div');
                        cell.className = 'small-cell';
                        const cellId = `${bigRow}-${bigCol}-${smallRow}-${smallCol}`;
                        cell.dataset.id = cellId;
                        cell.dataset.row = bigRow * 4 + smallRow;
                        cell.dataset.col = bigCol * 4 + smallCol;

                        allCells.push(cell);
                        bigCell.appendChild(cell);
                    }
                }

                mainGrid.appendChild(bigCell);
            }
        }

        allCells.forEach(cell => {
            cell._p1 = Math.random() * Math.PI * 2;
            cell._p2 = Math.random() * Math.PI * 2;
            cell._w1 = 0.4 + Math.random() * 0.6;

        const ghostIds = new Set([
            '2-2-1-0', '2-2-1-1',
            '2-2-2-0', '2-2-2-1',
            '2-2-3-0', '2-2-3-1', '2-2-3-2', '2-2-3-3',

        // 用与图标完全相同的坐标，把 wordmark 画成迷你粒子
        function drawWordmark() {
            const cvs = document.getElementById('logoY');
            const size = 15;
            const dpr = window.devicePixelRatio || 1;
            cvs.width = size * dpr;
            cvs.height = size * dpr;
            cvs.style.width = size + 'px';
            cvs.style.height = size + 'px';
            const ctx = cvs.getContext('2d');
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            ctx.scale(dpr, dpr);
            // 固定浅色墨水；浅色主题用 CSS invert 过渡，与背景换色同步
            ctx.fillStyle = '#f2f2f0';
            const cell = size / 16;
            const r = cell * 0.42;
            presetPattern.forEach(id => {
                const [br, bc, sr, sc] = id.split('-').map(Number);
                const x = (bc * 4 + sc + 0.5) * cell;
                const y = (br * 4 + sr + 0.5) * cell;
                ctx.globalAlpha = ghostIds.has(id) ? 0.10 : 1;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // ---------- 颜色主题（默认值即当前主题；服务器 theme.json 在线时覆盖） ----------
        const theme = { mode: 'gradient', solid: '#ffffff', from: '#ff8a5c', to: '#5c8aff' };

        async function loadTheme() {
            try {
                const resp = await fetch('/api/theme');
                if (resp.ok) {
                    Object.assign(theme, await resp.json());
                }
            } catch (e) {
                // 直接以 file:// 打开时走这里
            }
        }

        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [n >> 16 & 255, n >> 8 & 255, n & 255];
        }

        function lerpColor(a, b, t) {
            const c1 = hexToRgb(a), c2 = hexToRgb(b);
            const mix = c1.map((v, i) => Math.round(v + (c2[i] - v) * t));
            return `rgb(${mix[0]}, ${mix[1]}, ${mix[2]})`;
        }

        // 渐变固定为从中心向外
        function dotColor(row, col) {
            if (theme.mode === 'solid') return theme.solid;
            const t = Math.hypot(row - 7.5, col - 7.5) / Math.hypot(7.5, 7.5);
            return lerpColor(theme.from, theme.to, t);
        }

        function applyDotColor(cell) {
            cell.style.setProperty('--dot-color', dotColor(+cell.dataset.row, +cell.dataset.col));
        }

        function refreshColors() {
            document.querySelectorAll('.small-cell.selected').forEach(applyDotColor);
        }

        // ---------- 坐标的读取 ----------
        async function loadSelection() {
            await loadTheme();
            let ids = presetPattern;
            try {
                const resp = await fetch('/api/selection');
                if (resp.ok) {
                    ids = await resp.json();
                }
            } catch (e) {
                // 直接以 file:// 打开时走这里
            }
            applySelection(ids);
            document.getElementById('hero').classList.add('ready');
        }

        function applySelection(ids) {
            selected.clear();
            document.querySelectorAll('.small-cell').forEach(cell => {
                cell.classList.remove('selected');
            });
            ids.forEach(cellId => {
                const cell = document.querySelector(`[data-id="${cellId}"]`);
                if (cell) {
                    selected.add(cellId);
                    cell.classList.add('selected');
                    cell.classList.toggle('ghost', ghostIds.has(cellId));
                }
            });
            refreshColors();
        }

        const VOICE_ROWS = [
            [1, 2, 3],
            [4, 5, 6],
        ];

        function voiceCard(dict, id) {
            const avatar = `assets/avatars/${id}.png`;
            return (
                `<article class="voice">` +
                `<blockquote>${dict['q' + id]}</blockquote>` +
                `<div class="who">` +
                `<span class="avatar"><img src="${avatar}" alt="" width="40" height="40" decoding="async"></span>` +
                `<div class="meta"><span class="name">${dict['q' + id + 'n']}</span>` +
                `<span class="role">${dict['q' + id + 'r']}</span></div>` +
                `</div></article>`
            );
        }

        function renderVoiceMarquee(lang) {
            const root = document.getElementById('voiceMarquee');
            if (!root) return;
            const dict = I18N[lang];
            const dirs = ['left', 'right'];
            root.innerHTML = VOICE_ROWS.map((ids, i) => {
                const cards = ids.map(id => voiceCard(dict, id)).join('');
                return (
                    `<div class="marquee">` +
                    `<div class="marquee-track ${dirs[i]}">` +
                    `<div class="marquee-group">${cards}</div>` +
                    `<div class="marquee-group" aria-hidden="true">${cards}</div>` +
                    `</div></div>`
                );
            }).join('');
        }

        const LANG_TAGS = { zh: 'zh-CN', ja: 'ja', en: 'en' };

        function detectLang() {
            const saved = localStorage.getItem('yagent-lang');
            if (saved && I18N[saved]) return saved;
            const nav = (navigator.language || 'en').toLowerCase();
            if (nav.startsWith('zh')) return 'zh';
            if (nav.startsWith('ja')) return 'ja';
            return 'en';
        }

        const langRoot = document.getElementById('lang');
        const langBtn = langRoot.querySelector('.lang-btn');
        const langMenu = langRoot.querySelector('.menu-panel');

        function setLang(lang) {
            const dict = I18N[lang];
            document.documentElement.lang = LANG_TAGS[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = dict[el.dataset.i18n] || '';
            });
            document.querySelectorAll('[data-i18n-alt]').forEach(el => {
                el.setAttribute('alt', dict[el.dataset.i18nAlt] || '');
            });
            langMenu.querySelectorAll('[data-lang]').forEach(item => {
                const on = item.dataset.lang === lang;
                item.setAttribute('aria-selected', on ? 'true' : 'false');
                if (on) langRoot.querySelector('.lang-label').textContent = item.textContent.trim();
            });
            renderVoiceMarquee(lang);
            localStorage.setItem('yagent-lang', lang);
        }

        function openLangMenu() {
            YagentTheme.closeTheme();
            langRoot.classList.add('open');
            langBtn.setAttribute('aria-expanded', 'true');
            const current = langMenu.querySelector('[aria-selected="true"]');
            (current || langMenu.firstElementChild).focus();
        }

        function closeLangMenu() {
            langRoot.classList.remove('open');
            langBtn.setAttribute('aria-expanded', 'false');
        }

        langBtn.addEventListener('click', () => {
            if (langRoot.classList.contains('open')) closeLangMenu();
            else openLangMenu();
        });

        langMenu.addEventListener('click', e => {
            const item = e.target.closest('[data-lang]');
            if (!item) return;
            setLang(item.dataset.lang);
            closeLangMenu();
            langBtn.focus();
        });

        document.addEventListener('click', e => {
            if (!langRoot.contains(e.target)) closeLangMenu();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeLangMenu();
                return;
            }
            if (!langRoot.classList.contains('open')) return;
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            e.preventDefault();
            const items = [...langMenu.querySelectorAll('[data-lang]')];
            const at = items.indexOf(document.activeElement);
            const step = e.key === 'ArrowDown' ? 1 : -1;
            items[(at + step + items.length) % items.length].focus();
        });

        YagentTheme.mount();
        setLang(detectLang());
    </script>
