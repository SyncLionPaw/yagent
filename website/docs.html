<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --ink: #f2f2f0;
            --muted: rgba(242, 242, 240, 0.55);
            --faint: rgba(242, 242, 240, 0.35);
            --accent: #8fa3ff;
            --hairline: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 25px 25px;
            color: var(--ink);
            font-family: 'Space Grotesk', 'Hiragino Sans', 'PingFang SC', 'Noto Sans JP', 'Microsoft YaHei', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 32px;
            background: rgba(13, 13, 15, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 1px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--ink);
            text-decoration: none;
        }

        .wordmark canvas {
            display: block;
        }

        .topnav {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .topnav > a {
            font-size: 13px;
            color: var(--faint);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .topnav > a:hover {
            color: var(--ink);
        }

        /* ---------- 语言选择 ---------- */
        .lang {
            position: relative;
        }

        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--faint);
            border: 1px solid var(--hairline);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            line-height: 1.2;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .lang-btn:hover,
        .lang.open .lang-btn {
            color: var(--ink);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .lang-caret {
            opacity: 0.7;
            transition: transform 0.2s ease;
        }

        .lang.open .lang-caret {
            transform: rotate(180deg);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 20;
            min-width: 132px;
            margin: 0;
            padding: 6px;
            list-style: none;
            background: rgba(20, 20, 24, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: opacity 0.16s ease, transform 0.16s ease, visibility 0s linear 0.16s;
        }

        .lang.open .lang-menu {
            opacity: 1;
            visibility: visible;
            transform: none;
            transition: opacity 0.16s ease, transform 0.16s ease, visibility 0s;
        }

        .lang-menu li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .lang-menu li:hover,
        .lang-menu li:focus-visible {
            background: rgba(255, 255, 255, 0.07);
            color: var(--ink);
            outline: none;
        }

        .lang-menu li[aria-selected="true"] {
            color: var(--ink);
        }

        .lang-menu li[aria-selected="true"]::after {
            content: '✓';
            font-size: 11px;
            color: var(--accent);
        }

        .lang-btn:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .page {
            flex: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 96px 24px 100px;
            display: grid;
            grid-template-columns: 150px 1fr;
            column-gap: 56px;
            width: 100%;
        }

        h1 {
            grid-column: 1 / -1;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin: 0 0 32px;
        }

        .toc {
            position: sticky;
            top: 96px;
            align-self: start;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toc a {
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .toc a:hover {
            color: var(--ink);
        }

        .doc-section {
            border-top: 1px solid var(--hairline);
            padding: 32px 0;
            scroll-margin-top: 88px;
        }

        .doc-section h2 {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin: 0 0 14px;
        }

        .doc-section p {
            font-size: 14px;
            line-height: 1.9;
            color: var(--muted);
            margin: 0 0 12px;
            max-width: 40em;
        }

        .doc-section ul {
            margin: 0 0 12px;
            padding: 0;
            list-style: none;
        }

        .doc-section li {
            font-size: 14px;
            line-height: 1.9;
            color: var(--muted);
            padding: 6px 0 6px 18px;
            position: relative;
            max-width: 40em;
        }

        .doc-section li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--faint);
        }

        .doc-section li strong,
        .doc-section p strong {
            color: var(--ink);
            font-weight: 500;
        }

        code {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 0.86em;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            padding: 2px 6px;
        }

        kbd {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: var(--ink);
            border: 1px solid var(--hairline);
            border-radius: 5px;
            padding: 2px 7px;
        }

        .doc-section table {
            border-collapse: collapse;
            margin: 4px 0 12px;
        }

        .doc-section td {
            font-size: 14px;
            color: var(--muted);
            padding: 8px 32px 8px 0;
            border-top: 1px solid var(--hairline);
        }

        .doc-section tr:first-child td {
            border-top: none;
        }

        footer {
            padding: 32px;
            text-align: center;
            font-size: 12px;
            color: var(--faint);
            border-top: 1px solid var(--hairline);
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 18px 20px;
            }

            .topnav {
                gap: 14px;
            }

            .lang-btn {
                padding: 6px 10px;
                gap: 6px;
            }

            .page {
                grid-template-columns: 1fr;
            }

            .toc {
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px 18px;
                margin-bottom: 16px;
            }
        }
    </style>
</head>

        const LOGO_X = [
            '0000000000000000',
            '0000000000000000',
            '0000000000000000',
            '0000111100011000',
            '0000001100111000',
            '0000000101000000',
            '0000000111000000',
            '0000000110000000',
            '0000000110000000',
            '0000001022000000',
            '0000001022000000',
            '0001110022220000',
            '0001100002200000',
            '0000000000000000',
            '0000000000000000',
            '0000000000000000',

        function drawWordmark() {
            const cvs = document.getElementById('logoY');
            const size = 15;
            const dpr = window.devicePixelRatio || 1;
            cvs.width = size * dpr;
            cvs.height = size * dpr;
            cvs.style.width = size + 'px';
            cvs.style.height = size + 'px';
            const ctx = cvs.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.fillStyle = '#f2f2f0';
            const cell = size / 16;
            const r = cell * 0.42;
            LOGO_X.forEach((rowStr, row) => {
                for (let col = 0; col < 16; col++) {
                    const ch = rowStr[col];
                    if (ch !== '1' && ch !== '2') continue;
                    ctx.globalAlpha = ch === '2' ? 0.3 : 1;
                    ctx.beginPath();
                    ctx.arc((col + 0.5) * cell, (row + 0.5) * cell, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1;
        }
        drawWordmark();

                    {
                        id: 'shortcuts',
                        title: 'Keyboard shortcuts',
                        blocks: [
                            { table: [
                                ['<kbd>⌘</kbd> / <kbd>Ctrl</kbd> + <kbd>Enter</kbd>', 'Send message'],
                                ['<kbd>Enter</kbd>', 'New line'],
                                ['<kbd>⌘B</kbd>', 'Toggle the sidebar'],
                                ['<kbd>⌘N</kbd>', 'New task'],
                                ['<kbd>Esc</kbd>', 'Close dialog / exit voice'],
                            ] },
                        ],
                    },
                    {
                        id: 'share',
                        title: 'Sharing',
                        blocks: [
                            { p: 'The share button in the top bar creates a link to a <strong>read-only snapshot of the current branch</strong>. Anyone with the link can view but not interact; later conversation does not change the snapshot.' },
                        ],
                    },
                ],
            },
        };

        const LANG_TAGS = { zh: 'zh-CN', ja: 'ja', en: 'en' };

        function detectLang() {
            const saved = localStorage.getItem('yagent-lang');
            if (saved && DOC[saved]) return saved;
            const nav = (navigator.language || 'en').toLowerCase();
            if (nav.startsWith('zh')) return 'zh';
            if (nav.startsWith('ja')) return 'ja';
            return 'en';
        }

        function renderDocs(lang) {
            const dict = DOC[lang];
            document.documentElement.lang = LANG_TAGS[lang];
            document.getElementById('docTitle').textContent = dict.title;
            document.querySelector('[data-i18n="navDocs"]').textContent = dict.navDocs;
            document.querySelector('[data-i18n="navPricing"]').textContent = dict.navPricing;
            document.querySelector('[data-i18n="footer"]').textContent = dict.footer;

            const toc = document.getElementById('toc');
            const body = document.getElementById('docBody');
            toc.innerHTML = '';
            body.innerHTML = '';

            dict.sections.forEach(section => {
                const link = document.createElement('a');
                link.href = `#${section.id}`;
                link.textContent = section.title;
                toc.appendChild(link);

                const el = document.createElement('section');
                el.className = 'doc-section';
                el.id = section.id;
                const h2 = document.createElement('h2');
                h2.textContent = section.title;
                el.appendChild(h2);

                section.blocks.forEach(block => {
                    if (block.p) {
                        const p = document.createElement('p');
                        p.innerHTML = block.p;
                        el.appendChild(p);
                    } else if (block.ul) {
                        const ul = document.createElement('ul');
                        block.ul.forEach(item => {
                            const li = document.createElement('li');
                            li.innerHTML = item;
                            ul.appendChild(li);
                        });
                        el.appendChild(ul);
                    } else if (block.table) {
                        const table = document.createElement('table');
                        block.table.forEach(([key, desc]) => {
                            const tr = document.createElement('tr');
                            const tdKey = document.createElement('td');
                            const tdDesc = document.createElement('td');
                            tdKey.innerHTML = key;
                            tdDesc.textContent = desc;
                            tr.appendChild(tdKey);
                            tr.appendChild(tdDesc);
                            table.appendChild(tr);
                        });
                        el.appendChild(table);
                    }
                });

                body.appendChild(el);
            });
        }

        const langRoot = document.getElementById('lang');
        const langBtn = langRoot.querySelector('.lang-btn');
        const langMenu = langRoot.querySelector('.lang-menu');

        function setLang(lang) {
            renderDocs(lang);
            langMenu.querySelectorAll('[data-lang]').forEach(item => {
                const on = item.dataset.lang === lang;
                item.setAttribute('aria-selected', on ? 'true' : 'false');
                if (on) langRoot.querySelector('.lang-label').textContent = item.textContent.trim();
            });
            localStorage.setItem('yagent-lang', lang);
        }

        function openLangMenu() {
            langRoot.classList.add('open');
            langBtn.setAttribute('aria-expanded', 'true');
            const current = langMenu.querySelector('[aria-selected="true"]');
            (current || langMenu.firstElementChild).focus();
        }

        function closeLangMenu() {
            langRoot.classList.remove('open');
            langBtn.setAttribute('aria-expanded', 'false');
        }

        langBtn.addEventListener('click', () => {
            if (langRoot.classList.contains('open')) closeLangMenu();
            else openLangMenu();
        });

        langMenu.addEventListener('click', e => {
            const item = e.target.closest('[data-lang]');
            if (!item) return;
            setLang(item.dataset.lang);
            closeLangMenu();
            langBtn.focus();
        });

        document.addEventListener('click', e => {
            if (!langRoot.contains(e.target)) closeLangMenu();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeLangMenu();
                return;
            }
            if (!langRoot.classList.contains('open')) return;
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            e.preventDefault();
            const items = [...langMenu.querySelectorAll('[data-lang]')];
            const at = items.indexOf(document.activeElement);
            const step = e.key === 'ArrowDown' ? 1 : -1;
            items[(at + step + items.length) % items.length].focus();
        });

        setLang(detectLang());
    </script>
</body>
</html>
